[project]
name = "recipe-planner-backend"
version = "0.1.0"
description = "FastAPI backend for the Recipe Planner application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.14",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
cache_dir = ".artifacts/pytest_cache"

[tool.ruff]
cache-dir = ".artifacts/ruff_cache"
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (strict type hints)
    "D",   # pydocstyle (docstrings everywhere)
    "ASYNC",
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
cache_dir = ".artifacts/mypy_cache"

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
